IdempotencyKeyHeader:
  name: Idempotency-Key
  in: header
  # The key is required to prevent duplicate payments and refunds.
  required: true
  description: |
    This key is required to create a PaymentIntent or refund.
    Use the same key for each retry of the same request.
    The key prevents duplicate payments and refunds.
    Use a UUID v4 or another unique value.
  schema:
    type: string
    minLength: 1
    maxLength: 255
    example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d

XRequestIdHeader:
  name: X-Request-Id
  in: header
  required: false
  description: |
    Distributed correlation ID for end-to-end request tracing and observability.
  schema:
    type: string
    format: uuid
    example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
