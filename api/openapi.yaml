openapi: 3.0.3
info:
  title: Stripe-lite API Gateway
  description: |
    Production-grade baseline API specification for the Stripe-lite payment gateway.
    Adheres strictly to RFC 7807 Problem Details for all HTTP error representations.
  version: 1.0.0
  contact:
    name: Core Platform Architecture Team
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /v1
    description: Baseline v1 API gateway prefix

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: System
    description: Observability, telemetry, and health probe endpoints.
  - name: Authentication & Identity
    description: "Merchant identity, OAuth credentials, and scoped API tokens (Domain Owner: Khánh)."
  - name: Payments & Core Engine
    description: "Core payment intents, charges, refunds, and ledger operations (Domain Owner: Long)."
  - name: Webhooks
    description: "Webhook subscriptions, signature verifications, and event dispatch (Domain Owner: Sơn)."

paths:
  /healthz:
    get:
      summary: Health check probe
      description: Returns service operational readiness and liveness status.
      operationId: getHealthz
      security: []
      tags:
        - System
      responses:
        "200":
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          description: Malformed probe parameters.
          content:
            application/problem+json:
              schema:
                $ref: "./components/problem.yaml#/ProblemDocument"
        "503":
          description: Service is degraded or experiencing downstream failures.
          content:
            application/problem+json:
              schema:
                $ref: "./components/problem.yaml#/ProblemDocument"

  /auth/tokens:
    $ref: "./auth/tokens.yaml"

  /payment-intents:
    $ref: "./payments/payment_intents.yaml"

  /payment-intents/{id}:
    $ref: "./payments/payment_intents.yaml#/x-retrieve"

  /payment-intents/{id}/confirm:
    $ref: "./payments/payment_intents.yaml#/x-confirm"

  /payment-intents/{id}/capture:
    $ref: "./payments/payment_intents.yaml#/x-capture"

  /payment-intents/{id}/cancel:
    $ref: "./payments/payment_intents.yaml#/x-cancel"

  /refunds:
    $ref: "./payments/refunds.yaml"

  /refunds/{id}:
    $ref: "./payments/refunds.yaml#/x-retrieve"

  /webhook-endpoints:
    $ref: "./webhooks/endpoints.yaml"

  /webhook-endpoints/{id}:
    $ref: "./webhooks/endpoint.yaml"

  /webhook-endpoints/{id}/rotate-secret:
    $ref: "./webhooks/rotate_secret.yaml"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Scoped JWT bearer token issued by the identity service.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Merchant secret API key for direct server-to-server integration.

  parameters:
    IdempotencyKeyHeader:
      $ref: "./components/headers.yaml#/IdempotencyKeyHeader"
    XRequestIdHeader:
      $ref: "./components/headers.yaml#/XRequestIdHeader"
    StartingAfter:
      $ref: "./components/pagination.yaml#/StartingAfterQueryParam"
    EndingBefore:
      $ref: "./components/pagination.yaml#/EndingBeforeQueryParam"
    Limit:
      $ref: "./components/pagination.yaml#/LimitQueryParam"

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          example: ok
        timestamp:
          type: string
          format: date-time
          example: "2026-10-23T04:40:00Z"
        version:
          type: string
          example: "1.0.0"

    ProblemDocument:
      $ref: "./components/problem.yaml#/ProblemDocument"
    InvalidParam:
      $ref: "./components/problem.yaml#/InvalidParam"
